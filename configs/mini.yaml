# Elroy-mini: the laptop and single-GPU config.
# Same code, same data mix, same tokenizer. Trains in a few hours on one 12GB card.
name: elroy-mini

model:
  vocab_size: 32768
  n_layer: 8
  n_head: 8
  d_model: 512
  d_ff: 1408          # SwiGLU hidden, about 2.75x d_model rounded to a multiple of 64
  seq_len: 1024
  rope_theta: 10000
  tie_embeddings: true
  dropout: 0.0

data:
  shards_dir: data/shards
  mix:                 # sampling weights, normalized at load time
    python_edu: 0.45
    python_stack: 0.20
    fineweb_edu: 0.25
    cosmopedia: 0.10
  fim_rate: 0.5        # fraction of code documents transformed for fill-in-the-middle
  fim_spm_rate: 0.5    # of those, fraction in SPM rather than PSM order

train:
  total_tokens: 1_000_000_000
  tokens_per_step: 262_144      # global batch in tokens (micro_batch x seq_len x grad_accum x world_size)
  micro_batch: 16               # per-GPU sequences per forward pass; tune in Chapter 4
  lr: 6.0e-4
  min_lr_ratio: 0.1
  warmup_steps: 300
  anneal_fraction: 0.10         # final fraction of training with LR decaying to zero on the high-quality mix
  weight_decay: 0.1
  betas: [0.9, 0.95]
  grad_clip: 1.0
  dtype: bfloat16
  compile: true
  eval_every: 250
  checkpoint_every: 500
  milestone_every_tokens: 500_000_000
  seed: 1337
