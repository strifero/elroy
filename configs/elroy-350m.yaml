# Elroy-350M: the published run.
# 24-layer Llama-style decoder, about 360M parameters with a 32k tied vocabulary.
# Trained on two RTX A4500 (20GB, NVLink) for about 20B tokens.
name: elroy-350m

model:
  vocab_size: 32768
  n_layer: 24
  n_head: 16
  d_model: 1024
  d_ff: 3072          # SwiGLU hidden, 3x d_model
  seq_len: 2048
  rope_theta: 10000
  tie_embeddings: true
  dropout: 0.0

data:
  shards_dir: data/shards
  mix:
    python_edu: 0.45
    python_stack: 0.20
    fineweb_edu: 0.25
    cosmopedia: 0.10
  anneal_mix:          # used for the final anneal_fraction of training (2B tokens)
    python_edu: 0.60   # the main phase uses 8.1B of its 9.69B; 0.60 x 2B leaves it short of wrapping
    cosmopedia: 0.25   # textbook-style explanations, the closest thing in the corpus to the chat register
    fineweb_edu: 0.15
  fim_rate: 0.5
  fim_spm_rate: 0.5

train:
  total_tokens: 20_000_000_000
  tokens_per_step: 524_288      # 2048 seq x 256 sequences per optimizer step
  micro_batch: 4                # per-GPU; the Chapter 4 sweep on the A4500s: 4 fits (18.9GB), 8 does not
  lr: 4.0e-4
  min_lr_ratio: 0.1
  warmup_steps: 1000
  anneal_fraction: 0.10
  weight_decay: 0.1
  betas: [0.9, 0.95]
  grad_clip: 1.0
  dtype: bfloat16
  compile: true
  eval_every: 250
  checkpoint_every: 250          # about 90 minutes apart on the A4500s
  milestone_every_tokens: 5_000_000_000   # keep a permanent copy every 5B tokens
  seed: 1337
