[project]
name = "elroy"
version = "0.0.1"
description = "A small Python language model, built from scratch in plain PyTorch"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
dependencies = [
  "torch>=2.4",
  "numpy",
  "pyyaml",
  "regex",
  "tqdm",
  "huggingface_hub",
  "pyarrow",
  "datasets",
  "safetensors",
]

[tool.setuptools]
packages = ["elroy"]
